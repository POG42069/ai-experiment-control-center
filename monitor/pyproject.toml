[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "experiment-monitor"
version = "0.1.0"
description = "Lightweight W&B notebook monitoring wrapper for AI Experiment Control Center (ECC)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "wandb>=0.17",
]

[project.optional-dependencies]
hf = [
    "transformers>=4.40",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
